<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ─── SEO ─────────────────────────────────────────────────────────── -->
  <title>Colour Mural 🖌️ | Holi Festival 2026</title>
  <meta name="description" content="Create your own colorful Holi festival powder art and download your creation." />

  <!-- ─── Tailwind CSS via CDN ─────────────────────────────────────────── -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ─── Google Fonts ─────────────────────────────────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- ─── Tailwind Config ──────────────────────────────────────────────── -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
          },
          colors: {
            holi: {
              pink:   '#FF3CAC',
              orange: '#FF7000',
              yellow: '#FFD700',
              green:  '#00E676',
              cyan:   '#00E5FF',
              purple: '#7B2FFF',
              deep:   '#1A0533',
            },
          },
        },
      },
    };
  </script>

  <!-- ─── Shared Stylesheet ────────────────────────────────────────────── -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="font-outfit text-white min-h-screen flex flex-col justify-between">

  <!-- PARTICLES CANVAS -->
  <canvas id="particles-canvas"></canvas>

  <!-- NAVBAR -->
  <nav class="relative z-20 glass flex items-center justify-between px-4 py-3">
    <a href="menu.html" class="flex items-center gap-2 text-sm font-semibold text-white/90 hover:text-white transition-colors"
       data-i18n-en="← Menu"
       data-i18n-es="← Menú">
      <span>←</span>
      <span>Menu</span>
    </a>
    
    <div class="flex items-center gap-2">
      <button onclick="I18N.toggleLang()" class="lang-toggle-btn glass px-3 py-1.5 rounded-full text-xs font-bold border border-white/20 hover:border-holi-yellow transition-all flex items-center gap-1">
        🇬🇧 <span class="font-bold text-holi-yellow">EN</span> / <span class="opacity-60">ES</span>
      </button>
      <a href="index.html" class="text-xs font-semibold px-3 py-1.5 rounded-lg glass border border-white/20 hover:border-white text-white/80 hover:text-white transition-all"
         data-i18n-en="Home 🏠"
         data-i18n-es="Inicio 🏠">
        Home 🏠
      </a>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="relative z-10 max-w-lg w-full mx-auto px-4 py-6 flex flex-col gap-4 my-auto">
    <div class="text-center">
      <h1 class="font-black text-2xl sm:text-3xl grad-text"
          data-i18n-en="Colour Mural 🖌️"
          data-i18n-es="Mural de Colores 🖌️">Colour Mural 🖌️</h1>
      <p class="text-white/70 text-xs sm:text-sm mt-1"
         data-i18n-en="Tap or drag on the canvas to throw colourful Holi powder!"
         data-i18n-es="¡Toca o arrastra en el lienzo para lanzar polvos de colores!">Tap or drag on the canvas to throw colourful Holi powder!</p>
    </div>

    <!-- Palette -->
    <div id="mural-palette" class="flex flex-wrap justify-center gap-2.5 py-1"></div>

    <!-- Brush size control -->
    <div class="glass rounded-xl px-4 py-2 flex items-center gap-3 border border-white/10">
      <span class="text-white/70 text-xs font-semibold"
            data-i18n-en="Brush Size:"
            data-i18n-es="Tamaño de Pincel:">Brush Size:</span>
      <input id="brush-size" type="range" min="6" max="45" value="16" class="flex-1 accent-pink-500 cursor-pointer" />
      <span id="brush-size-label" class="text-holi-yellow text-xs font-bold w-6 text-right">16</span>
    </div>

    <!-- Canvas -->
    <div class="relative rounded-2xl overflow-hidden border-2 border-white/20 shadow-2xl bg-[#0D0020]">
      <canvas id="mural-canvas" class="block w-full touch-none cursor-crosshair" style="height: 340px;"></canvas>
      <div id="mural-hint" class="absolute inset-0 flex items-center justify-center text-white/30 text-sm pointer-events-none select-none"
           data-i18n-en="✨ Tap or drag anywhere to paint!"
           data-i18n-es="✨ ¡Toca o arrastra para pintar!">
        ✨ Tap or drag anywhere to paint!
      </div>
    </div>

    <!-- Actions -->
    <div class="flex gap-3">
      <button id="mural-clear-btn" onclick="muralClear()"
        class="btn-holi flex-1 glass rounded-xl py-3 text-sm font-bold border border-white/15 text-white/80 hover:text-white"
        data-i18n-en="🗑️ Clear"
        data-i18n-es="🗑️ Limpiar">
        🗑️ Clear
      </button>
      <button id="mural-save-btn" onclick="muralSave()"
        class="btn-holi flex-1 glass rounded-xl py-3 text-sm font-bold border border-holi-cyan/40 text-holi-cyan hover:bg-holi-cyan/20"
        data-i18n-en="💾 Download Art"
        data-i18n-es="💾 Guardar Imagen">
        💾 Download Art
      </button>
    </div>

    <!-- Back to Menu -->
    <div class="text-center mt-1">
      <a href="menu.html" class="btn-holi glass rounded-xl px-6 py-2.5 text-white/70 hover:text-white text-xs border border-white/10"
         data-i18n-en="← Back to Activities Menu"
         data-i18n-es="← Volver al Menú de Actividades">
        ← Back to Activities Menu
      </a>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="relative z-10 text-center py-3 text-xs text-white/40">
    Instituto de Idiomas de Salta • English Week 2026
  </footer>

  <!-- Scripts -->
  <script src="js/i18n.js"></script>
  <script src="js/particles.js"></script>
  <script>
    const PALETTE_COLORS = ['#FF3CAC','#FF7000','#FFD700','#00E676','#00E5FF','#7B2FFF','#FF4444','#FFFFFF','#000000'];
    let muralColor = '#FF3CAC';
    let muralPainting = false;

    // Build color palette buttons
    const palette = document.getElementById('mural-palette');
    PALETTE_COLORS.forEach((col, idx) => {
      const btn = document.createElement('button');
      btn.className = 'w-9 h-9 rounded-full border-2 transition-all hover:scale-110 active:scale-95 ' + (idx === 0 ? 'border-white scale-110' : 'border-transparent');
      btn.style.background = col;
      btn.setAttribute('aria-label', col);
      btn.onclick = () => {
        muralColor = col;
        palette.querySelectorAll('button').forEach(b => b.classList.remove('border-white','scale-110'));
        btn.classList.add('border-white','scale-110');
      };
      palette.appendChild(btn);
    });

    const canvas = document.getElementById('mural-canvas');
    const ctx = canvas.getContext('2d');
    const sizeIn = document.getElementById('brush-size');
    const sizeLabel = document.getElementById('brush-size-label');

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const imgData = ctx.getImageData(0, 0, canvas.width || 1, canvas.height || 1);
      canvas.width = rect.width || 340;
      canvas.height = rect.height || 340;
      try { ctx.putImageData(imgData, 0, 0); } catch(e) {}
    }
    
    // Initial size setup
    setTimeout(resizeCanvas, 50);
    window.addEventListener('resize', resizeCanvas);

    sizeIn.addEventListener('input', () => { 
      sizeLabel.textContent = sizeIn.value; 
    });

    function spray(x, y) {
      const hint = document.getElementById('mural-hint');
      if (hint) hint.style.display = 'none';
      const radius = parseInt(sizeIn.value);
      ctx.fillStyle = muralColor;
      for (let i = 0; i < 30; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * radius;
        const dx = x + Math.cos(angle) * dist;
        const dy = y + Math.sin(angle) * dist;
        const dotR = Math.random() * 2.5 + 0.5;
        ctx.globalAlpha = Math.random() * 0.7 + 0.3;
        ctx.beginPath();
        ctx.arc(dx, dy, dotR, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const src = e.touches ? e.touches[0] : e;
      return { 
        x: src.clientX - rect.left, 
        y: src.clientY - rect.top 
      };
    }

    // Mouse events
    canvas.addEventListener('mousedown', (e) => { 
      muralPainting = true; 
      const p = getPos(e); 
      spray(p.x, p.y); 
    });
    canvas.addEventListener('mousemove', (e) => { 
      if (muralPainting) { 
        const p = getPos(e); 
        spray(p.x, p.y); 
      } 
    });
    canvas.addEventListener('mouseup', () => { muralPainting = false; });
    canvas.addEventListener('mouseleave', () => { muralPainting = false; });

    // Touch events for mobile phones
    canvas.addEventListener('touchstart', (e) => { 
      e.preventDefault(); 
      muralPainting = true; 
      const p = getPos(e); 
      spray(p.x, p.y); 
    }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { 
      e.preventDefault(); 
      if (muralPainting) { 
        const p = getPos(e); 
        spray(p.x, p.y); 
      } 
    }, { passive: false });
    canvas.addEventListener('touchend', () => { muralPainting = false; });

    function muralClear() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const hint = document.getElementById('mural-hint');
      if (hint) hint.style.display = '';
    }

    function muralSave() {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = canvas.width;
      exportCanvas.height = canvas.height;
      const exportCtx = exportCanvas.getContext('2d');
      exportCtx.fillStyle = '#0D0020';
      exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
      exportCtx.drawImage(canvas, 0, 0);

      const link = document.createElement('a');
      link.download = 'my-holi-artwork.png';
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
