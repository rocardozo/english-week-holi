<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ─── SEO ─────────────────────────────────────────────────────────── -->
  <title>Holi Trivia Quiz 🧠 | English Week 2026</title>
  <meta name="description" content="Test your Holi knowledge in our fun interactive quiz. Answer questions and win a prize!" />

  <!-- ─── Tailwind CSS via CDN ─────────────────────────────────────────── -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ─── Google Fonts ─────────────────────────────────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- ─── Tailwind Config ──────────────────────────────────────────────── -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
          },
          colors: {
            holi: {
              pink:   '#FF3CAC',
              orange: '#FF7000',
              yellow: '#FFD700',
              green:  '#00E676',
              cyan:   '#00E5FF',
              purple: '#7B2FFF',
              deep:   '#1A0533',
            },
          },
        },
      },
    };
  </script>

  <!-- ─── Shared Stylesheet ────────────────────────────────────────────── -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="font-outfit text-white min-h-screen flex flex-col justify-between">

  <!-- PARTICLES CANVAS -->
  <canvas id="particles-canvas"></canvas>

  <!-- CONFETTI CONTAINER (for winner view) -->
  <div id="confetti-container" class="fixed inset-0 pointer-events-none overflow-hidden z-40"></div>

  <!-- NAVBAR -->
  <nav class="relative z-20 glass flex items-center justify-between px-5 py-3">
    <a href="menu.html" class="flex items-center gap-2 text-sm font-semibold text-white/90 hover:text-white transition-colors">
      <span>←</span>
      <span>Menu</span>
    </a>
    <span class="font-bold text-sm text-holi-yellow">Holi Trivia Quiz</span>
    <a href="index.html" class="text-xs font-semibold px-3 py-1.5 rounded-lg glass border border-white/20 hover:border-white text-white/80 hover:text-white transition-all">
      Home 🏠
    </a>
  </nav>

  <!-- QUIZ VIEW -->
  <main id="quiz-section" class="relative z-10 max-w-lg w-full mx-auto px-4 py-8 flex flex-col gap-5 my-auto">
    <!-- Progress bar -->
    <div class="w-full glass rounded-full h-3 overflow-hidden border border-white/10">
      <div id="trivia-progress-bar" class="h-full rounded-full bg-gradient-to-r from-holi-pink via-holi-orange to-holi-yellow" style="width: 0%;"></div>
    </div>

    <!-- Header Stats -->
    <div class="flex items-center justify-between text-xs text-white/60 px-1">
      <span id="trivia-counter" class="font-semibold">Question 1 / 8</span>
      <span>Score: <strong id="trivia-score" class="text-holi-yellow text-sm font-black">0</strong></span>
    </div>

    <!-- Question Card -->
    <div id="trivia-question-card" class="glass rounded-2xl p-6 border border-white/15 shadow-xl">
      <p id="trivia-question-emoji" class="text-4xl mb-3 text-center">❓</p>
      <h2 id="trivia-question-text" class="font-black text-xl sm:text-2xl text-center text-white mb-6 leading-snug"></h2>
      
      <!-- Options Container -->
      <div id="trivia-options" class="flex flex-col gap-3"></div>
    </div>

    <!-- Feedback text -->
    <p id="trivia-feedback" class="text-center font-bold text-base sm:text-lg min-h-7"></p>

    <!-- Next Question Button -->
    <button id="trivia-next-btn" onclick="triviaNext()"
      class="btn-holi hidden glass rounded-xl py-3.5 font-black text-white border border-holi-purple/50 bg-gradient-to-r from-holi-purple via-holi-pink to-holi-orange shadow-lg text-base">
      Next Question →
    </button>

    <div class="text-center mt-2">
      <a href="menu.html" class="text-white/50 hover:text-white text-xs transition-colors">
        ← Exit to Activities Menu
      </a>
    </div>
  </main>

  <!-- WINNER / RESULTS VIEW (Hidden by default) -->
  <section id="winner-section" class="relative z-20 max-w-sm w-full mx-auto px-4 py-8 hidden flex-col items-center gap-5 text-center my-auto">
    <div class="text-8xl animate-bounce">🏆</div>
    <h1 class="font-black text-4xl sm:text-5xl grad-text">Quiz Complete!</h1>
    
    <div class="glass rounded-2xl px-8 py-5 border border-holi-yellow/40 w-full shadow-2xl">
      <p class="text-white/60 text-xs uppercase tracking-widest">Your Final Score</p>
      <p id="winner-score" class="font-black text-5xl text-holi-yellow mt-1">8 / 8</p>
      <p id="winner-msg" class="text-white/80 text-sm mt-2 font-semibold">Perfect score!</p>
    </div>

    <div class="glass rounded-2xl px-6 py-4 border border-holi-pink/40 w-full bg-gradient-to-br from-holi-pink/10 to-holi-purple/10">
      <p class="text-3xl mb-1">🎁</p>
      <p class="font-bold text-white text-base">Show this screen at our stand!</p>
      <p class="text-white/60 text-xs mt-1">Visit 2nd Year stand to claim your sweet reward 🙌</p>
    </div>

    <div class="flex flex-col sm:flex-row gap-3 w-full mt-2">
      <button onclick="restartQuiz()"
        class="btn-holi flex-1 glass rounded-xl py-3 font-bold text-sm border border-holi-purple/40 bg-holi-purple/20 text-white">
        Play Again 🔄
      </button>
      <a href="menu.html"
        class="btn-holi flex-1 glass rounded-xl py-3 font-bold text-sm border border-white/20 text-white">
        Menu 🎊
      </a>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="relative z-10 text-center py-4 text-xs text-white/40">
    Instituto de Idiomas de Salta • English Week 2026
  </footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/particles.js"></script>
  <script>
    let triviaIndex = 0;
    let triviaScore = 0;
    let triviaLocked = false;

    function renderTriviaQuestion() {
      if (triviaIndex >= TRIVIA.length) {
        showResults();
        return;
      }

      triviaLocked = false;
      const q = TRIVIA[triviaIndex];
      const pct = (triviaIndex / TRIVIA.length * 100).toFixed(0);

      document.getElementById('trivia-progress-bar').style.width = pct + '%';
      document.getElementById('trivia-counter').textContent = 'Question ' + (triviaIndex + 1) + ' / ' + TRIVIA.length;
      document.getElementById('trivia-score').textContent = triviaScore;
      document.getElementById('trivia-question-emoji').textContent = q.emoji;
      document.getElementById('trivia-question-text').textContent = q.question;
      
      const fb = document.getElementById('trivia-feedback');
      fb.textContent = '';
      fb.className = 'text-center font-bold text-base sm:text-lg min-h-7';
      
      document.getElementById('trivia-next-btn').classList.add('hidden');

      const container = document.getElementById('trivia-options');
      container.innerHTML = '';
      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.id = 'trivia-opt-' + i;
        btn.className = 'trivia-opt glass rounded-xl px-4 py-3.5 text-left font-semibold text-white text-sm w-full';
        btn.textContent = ['A', 'B', 'C', 'D'][i] + '. ' + opt;
        btn.onclick = () => triviaAnswer(i);
        container.appendChild(btn);
      });
    }

    function triviaAnswer(chosen) {
      if (triviaLocked) return;
      triviaLocked = true;

      const q = TRIVIA[triviaIndex];
      const isRight = chosen === q.correct;
      if (isRight) triviaScore++;

      q.options.forEach((_, i) => {
        const btn = document.getElementById('trivia-opt-' + i);
        btn.disabled = true;
        if (i === q.correct) btn.classList.add('correct');
        else if (i === chosen && !isRight) btn.classList.add('incorrect');
      });

      const fb = document.getElementById('trivia-feedback');
      fb.textContent = isRight
        ? '🎉 Correct! Well done!'
        : '❌ Not quite — the answer was "' + q.options[q.correct] + '"';
      fb.className = 'text-center font-bold text-base sm:text-lg min-h-7 ' + (isRight ? 'text-holi-green' : 'text-red-400');

      const nextBtn = document.getElementById('trivia-next-btn');
      nextBtn.classList.remove('hidden');
      nextBtn.textContent = (triviaIndex + 1 < TRIVIA.length) ? 'Next Question →' : 'See Final Results 🏆';
    }

    function triviaNext() {
      triviaIndex++;
      renderTriviaQuestion();
    }

    function showResults() {
      document.getElementById('quiz-section').classList.add('hidden');
      const winSec = document.getElementById('winner-section');
      winSec.classList.remove('hidden');
      winSec.classList.add('flex');

      document.getElementById('winner-score').textContent = triviaScore + ' / ' + TRIVIA.length;
      const pct = triviaScore / TRIVIA.length;
      const msg = pct === 1     ? '🌟 Perfect score! You are a true Holi expert!'
                : pct >= 0.75   ? '👏 Great job! Almost perfect!'
                : pct >= 0.5    ? '👍 Good job! Keep learning!'
                : '💪 Keep trying — practice makes perfect!';
      document.getElementById('winner-msg').textContent = msg;

      launchConfetti();
    }

    function restartQuiz() {
      triviaIndex = 0;
      triviaScore = 0;
      triviaLocked = false;
      document.getElementById('confetti-container').innerHTML = '';
      document.getElementById('winner-section').classList.add('hidden');
      document.getElementById('winner-section').classList.remove('flex');
      document.getElementById('quiz-section').classList.remove('hidden');
      renderTriviaQuestion();
    }

    function launchConfetti() {
      const container = document.getElementById('confetti-container');
      container.innerHTML = '';
      const CONFETTI_COLORS = ['#FF3CAC','#FF7000','#FFD700','#00E676','#00E5FF','#7B2FFF','#FF4444','#FFFFFF'];
      for (let i = 0; i < 90; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.cssText =
          'left:' + (Math.random() * 100) + '%;' +
          'background:' + CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)] + ';' +
          'animation-duration:' + (Math.random() * 3 + 2) + 's;' +
          'animation-delay:' + (Math.random() * 2) + 's;' +
          'width:' + (Math.random() * 8 + 6) + 'px;' +
          'height:' + (Math.random() * 10 + 8) + 'px;' +
          'border-radius:' + (Math.random() > 0.5 ? '50%' : '2px') + ';';
        container.appendChild(piece);
      }
    }

    // Start quiz on load
    renderTriviaQuestion();
  </script>
</body>
</html>
