<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ─── SEO ─────────────────────────────────────────────────────────── -->
  <title>Color Meanings 🌸 | Holi Festival 2026</title>
  <meta name="description" content="Discover the spiritual and symbolic meanings behind each vibrant colour of the Holi Festival." />

  <!-- ─── Tailwind CSS via CDN ─────────────────────────────────────────── -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ─── Google Fonts ─────────────────────────────────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- ─── Tailwind Config ──────────────────────────────────────────────── -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
          },
          colors: {
            holi: {
              pink:   '#FF3CAC',
              orange: '#FF7000',
              yellow: '#FFD700',
              green:  '#00E676',
              cyan:   '#00E5FF',
              purple: '#7B2FFF',
              deep:   '#1A0533',
            },
          },
        },
      },
    };
  </script>

  <!-- ─── Shared Stylesheet ────────────────────────────────────────────── -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="font-outfit text-white min-h-screen flex flex-col justify-between">

  <!-- PARTICLES CANVAS -->
  <canvas id="particles-canvas"></canvas>

  <!-- NAVBAR -->
  <nav class="relative z-20 glass flex items-center justify-between px-5 py-3">
    <a href="menu.html" class="flex items-center gap-2 text-sm font-semibold text-white/90 hover:text-white transition-colors">
      <span>←</span>
      <span>Menu</span>
    </a>
    <span class="font-bold text-sm text-holi-pink">Color Meanings</span>
    <a href="index.html" class="text-xs font-semibold px-3 py-1.5 rounded-lg glass border border-white/20 hover:border-white text-white/80 hover:text-white transition-all">
      Home 🏠
    </a>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="relative z-10 max-w-lg w-full mx-auto px-4 py-8 flex flex-col gap-6">
    <div class="text-center">
      <h1 class="font-black text-3xl sm:text-4xl grad-text">Color Meanings 🌸</h1>
      <p class="text-white/70 text-sm mt-2">Tap any card to flip it and reveal what it symbolises!</p>
    </div>

    <!-- Cards Grid -->
    <div id="color-cards-grid" class="grid grid-cols-2 gap-4"></div>

    <!-- Back to Menu Button -->
    <div class="text-center mt-4">
      <a href="menu.html" class="btn-holi glass rounded-xl px-8 py-3 text-white/90 font-bold text-sm border border-holi-pink/40 hover:border-holi-pink">
        ← Back to Activities Menu
      </a>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="relative z-10 text-center py-4 text-xs text-white/40">
    Instituto de Idiomas de Salta • English Week 2026
  </footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/particles.js"></script>
  <script>
    (function renderColorCards() {
      const grid = document.getElementById('color-cards-grid');

      COLOR_DATA.forEach(function(c) {
        const wrapper = document.createElement('div');
        wrapper.className = 'color-card w-full h-48';
        wrapper.setAttribute('role', 'button');
        wrapper.setAttribute('aria-label', c.name + ' colour card — tap to flip');
        wrapper.setAttribute('tabindex', '0');
        wrapper.onclick = function() { wrapper.classList.toggle('flipped'); };
        wrapper.onkeydown = function(e) {
          if (e.key === 'Enter' || e.key === ' ') wrapper.classList.toggle('flipped');
        };

        wrapper.innerHTML =
          '<div class="color-card-inner w-full h-full">' +
            '<div class="color-card-front" style="background:linear-gradient(135deg,' + c.color + '33,' + c.color + '11);border:2px solid ' + c.color + '66;">' +
              '<span class="text-4xl mb-1">' + c.emoji + '</span>' +
              '<div class="w-8 h-8 rounded-full mb-2 shadow-lg" style="background:' + c.color + ';box-shadow:0 0 16px ' + c.color + 'aa;"></div>' +
              '<p class="font-black text-lg text-white">' + c.name + '</p>' +
              '<p class="text-xs text-white/60 mt-1">Tap to flip ↺</p>' +
            '</div>' +
            '<div class="color-card-back text-center" style="background:linear-gradient(135deg,' + c.color + '55,' + c.color + '22);border:2px solid ' + c.color + '99;">' +
              '<p class="font-black text-base text-white mb-1" style="text-shadow:0 0 12px ' + c.color + '">' + c.name + '</p>' +
              '<p class="font-bold text-xs mb-2" style="color:' + c.color + '">' + c.short + '</p>' +
              '<p class="text-white/90 text-xs leading-relaxed">' + c.detail + '</p>' +
            '</div>' +
          '</div>';

        grid.appendChild(wrapper);
      });
    })();
  </script>
</body>
</html>
